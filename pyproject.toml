[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contamlab"
version = "0.1.0"
description = "LLM ベンチマークの汚染を、検定・信頼区間・検出力・多重比較補正つきで測る"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "shati-napo" }]
keywords = [
    "llm",
    "benchmark-contamination",
    "data-contamination",
    "evaluation",
    "statistical-power",
    "preregistration",
    "japanese",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 依存パッケージを持たない。統計層が成果物の中心なので、scipy に隠れた実装を
# 信用する代わりに式をそのまま書き、既知の表値への回帰テストで固定している。
dependencies = []

# ★ 以降はテーブル。[project] の素の key は上に置ききること。
#   ここに [project.urls] を挟むと、続く dependencies が project.urls.dependencies に
#   吸われてビルドが落ちる(2026-08-08 に実際にやった。CI が捕まえた)。
[project.urls]
Repository = "https://github.com/shati-napo/contamlab"
Issues = "https://github.com/shati-napo/contamlab/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
contamlab = "contamlab.cli:main"

[tool.setuptools.packages.find]
include = ["contamlab*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
